  <!-- Fix React + Google Translate Crash -->
  <script>
    if (typeof Node === 'function' && Node.prototype) {
      const originalRemoveChild = Node.prototype.removeChild;
      Node.prototype.removeChild = function(child) {
        if (child.parentNode !== this) {
          if (console) {
            console.warn('React+Translate Fix: Cannot remove a child from a different parent', child, this);
          }
          return child;
        }
        return originalRemoveChild.apply(this, arguments);
      };

      const originalInsertBefore = Node.prototype.insertBefore;
      Node.prototype.insertBefore = function(newNode, referenceNode) {
        if (referenceNode && referenceNode.parentNode !== this) {
          if (console) {
            console.warn('React+Translate Fix: Cannot insert before a reference node from a different parent', referenceNode, this);
          }
          referenceNode = null;
        }
        return originalInsertBefore.apply(this, arguments);
      };
      const originalReplaceChild = Node.prototype.replaceChild;
      Node.prototype.replaceChild = function(newChild, oldChild) {
        if (oldChild.parentNode !== this) {
          if (console) {
            console.warn('React+Translate Fix: Cannot replace a child from a different parent', oldChild, this);
          }
          return oldChild;
        }
        return originalReplaceChild.apply(this, arguments);
      };
    }
  </script>

    (function() {
      if (document.cookie.indexOf('googtrans=') === -1) {
        var lang = navigator.language.toLowerCase();
        var targetLang = 'th';
        if (lang.startsWith('en')) targetLang = 'en';
        else if (lang.startsWith('zh')) targetLang = 'zh-CN';
        else if (lang.startsWith('my')) targetLang = 'my';
        
        if (targetLang !== 'th') {
          document.cookie = 'googtrans=/th/' + targetLang + '; path=/';
        }
      }
    })();
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'th', includedLanguages: 'th,en,zh-CN,my', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');

  </script>
